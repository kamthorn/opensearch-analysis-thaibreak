import org.opensearch.gradle.test.RestIntegTestTask

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'opensearch.opensearchplugin'
apply plugin: 'opensearch.yaml-rest-test'
apply plugin: 'opensearch.pluginzip'

def pluginName = 'analysis-thaibreak'
def pluginDescription = 'Thai word segmentation analysis plugin using Viterbi+TCC algorithm'
def packagePath = 'org.opensearch.analysis.thai'
def pluginClassName = 'ThaiBreakPlugin'
group = "org.opensearch.analysis"
version = "${opensearch_version}.0"

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        pluginZip(MavenPublication) { publication ->
            pom {
                name = pluginName
                description = pluginDescription
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "kamthorn"
                        url = "https://github.com/kamthorn/opensearch-analysis-thaibreak"
                    }
                }
            }
        }
    }
}

opensearchplugin {
    name pluginName
    description pluginDescription
    classname "${packagePath}.${pluginClassName}"
    licenseFile rootProject.file('LICENSE.txt')
    noticeFile rootProject.file('NOTICE.txt')
}

// This requires an additional Jar not published as part of build-tools
loggerUsageCheck.enabled = false

// No need to validate pom, as we do not upload to maven/sonatype
validateNebulaPom.enabled = false

// Disable testingConventions: there are no yamlRestTest specs and no dedicated
// integTest source set yet (the integTest task below just replays the unit
// tests against a live cluster). Tracked as a follow-up; re-enable once real
// REST/integ coverage exists.
testingConventions.enabled = false

// Exclude standalone benchmark runner from test forbiddenApis checks
tasks.named('forbiddenApisTest').configure {
    exclude '**/benchmark/**'
}

buildscript {
    ext {
        opensearch_version = System.getProperty("opensearch.version", "3.8.0")
    }

    repositories {
        mavenLocal()
        maven { url "https://ci.opensearch.org/maven2/" }
        maven { url "https://ci.opensearch.org/m2/" }
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "org.opensearch.gradle:build-tools:${opensearch_version}"
    }
}

repositories {
    mavenLocal()
    maven { url "https://ci.opensearch.org/maven2/" }
    maven { url "https://ci.opensearch.org/m2/" }
    mavenCentral()
    maven { url "https://plugins.gradle.org/m2/" }
}

test {
    include '**/*Tests.class'
}

task integTest(type: RestIntegTestTask) {
    description = "Run tests against a cluster"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}
tasks.named("check").configure { dependsOn(integTest) }

integTest {
    if (System.getProperty("test.debug") != null) {
        jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005'
    }
}

testClusters.integTest {
    testDistribution = "INTEG_TEST"
    plugin(project.tasks.bundlePlugin.archiveFile)
}

run {
    useCluster testClusters.integTest
}

task benchmark(type: JavaExec) {
    description = "Run Thai segmentation and tokenization performance benchmarks"
    group = "Verification"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.opensearch.analysis.thai.benchmark.ThaiTokenizerBenchmark"
}

def targetOpenSearchVersions = ['2.11.1', '2.15.0', '2.17.1', '2.18.0', '2.19.0', '3.8.0']

task packageAllDistributions {
    description = "Packages plugin ZIPs for all targeted OpenSearch versions"
    group = "Distribution"
    dependsOn tasks.jar

    doLast {
        def distDir = file("${buildDir}/distributions")
        distDir.mkdirs()

        targetOpenSearchVersions.each { osVer ->
            def pluginVer = "${osVer}.0"
            def zipFile = file("${distDir}/analysis-thaibreak-${pluginVer}.zip")
            def tempDescDir = file("${buildDir}/tmp/desc-${osVer}")
            tempDescDir.mkdirs()
            def descFile = file("${tempDescDir}/plugin-descriptor.properties")
            descFile.text = """description=${pluginDescription}
version=${pluginVer}
name=${pluginName}
classname=${packagePath}.${pluginClassName}
java.version=21
opensearch.version=${osVer}
has.native.controller=false
"""

            ant.zip(destfile: zipFile) {
                fileset(file: descFile)
                fileset(file: tasks.jar.archiveFile.get().asFile) {
                    filename(name: tasks.jar.archiveFile.get().asFile.name)
                }
                fileset(file: rootProject.file('LICENSE.txt'))
                fileset(file: rootProject.file('NOTICE.txt'))
            }
            logger.lifecycle("Created distribution ZIP: ${zipFile.name}")
        }
    }
}

