name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Checks and Package All Plugin Distributions
      run: ./gradlew check packageAllDistributions

    - name: Compute SHA512 Checksums
      run: |
        cd build/distributions
        for f in analysis-thaibreak-*.zip; do
          sha512sum "${f}" > "${f}.sha512"
        done
        ls -la

    - name: Create GitHub Release and Attach Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/distributions/analysis-thaibreak-*.zip
          build/distributions/analysis-thaibreak-*.zip.sha512
        generate_release_notes: true
        name: Release ${{ github.ref_name || github.event.inputs.tag_name }}
        draft: false
        prerelease: false
