name: Publish Docker Images

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_latest:
        description: 'Tag OpenSearch 2.18.0 as latest'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image (${{ matrix.opensearch_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opensearch_version: ['2.18.0', '2.19.0', '3.8.0']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/opensearch-thaibreak"
          # Convert to lowercase
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          TAGS="${IMAGE_NAME}:${{ matrix.opensearch_version }}"
          
          # If this is 2.18.0 (default stable), also tag as latest
          if [ "${{ matrix.opensearch_version }}" = "2.18.0" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            OPENSEARCH_VERSION=${{ matrix.opensearch_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
