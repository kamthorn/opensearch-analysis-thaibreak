name: Multi-Version Matrix Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  matrix-build:
    name: Build OpenSearch ${{ matrix.opensearch-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opensearch-version: ['2.15.0', '2.17.1', '2.18.0', '2.19.0', '3.8.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Package Plugin for OpenSearch ${{ matrix.opensearch-version }}
      run: ./gradlew build bundlePlugin -Dopensearch.version=${{ matrix.opensearch-version }}

    - name: Upload Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: analysis-thaibreak-${{ matrix.opensearch-version }}
        path: build/distributions/*.zip
