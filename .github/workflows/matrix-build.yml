name: Multi-Version Matrix Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Single build with default Gradle wrapper (3.8.0 build-tools),
  # then repackage ZIPs for all target OpenSearch versions via the
  # packageAllDistributions Gradle task. This avoids Gradle API
  # incompatibilities between opensearch build-tools 2.x and Gradle 9.x.
  package-all:
    name: Build & Package All OpenSearch Versions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build, Test and Package All Distributions
      run: ./gradlew check packageAllDistributions

    - name: Upload Plugin Artifacts (all versions)
      uses: actions/upload-artifact@v4
      with:
        name: analysis-thaibreak-all-versions
        path: build/distributions/*.zip

  smoke-test:
    name: Smoke test on OpenSearch ${{ matrix.opensearch_version }}
    needs: package-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with targetOpenSearchVersions in build.gradle
        opensearch_version: ['2.15.0', '2.17.1', '2.18.0', '2.19.0', '3.8.0', '3.9.0']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: analysis-thaibreak-all-versions
        path: dist
    - name: Install the plugin and run _analyze
      run: scripts/smoke-test.sh ${{ matrix.opensearch_version }} dist
